# Local or home-network use: http://localhost:8080 (or http://<this-machine>:8080
# from a phone on the same network). For a public address with HTTPS, see
# docker-compose.prod.yml and docs/DEPLOY.md.
services:
  backend:
    build: ./backend
    volumes:
      - ${DATA_PATH:-./data}:/data
    environment:
      - LICHESS_TOKEN=${LICHESS_TOKEN:-}
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
